<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="shortcut icon" href="../assets/arrow.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/swal-toast.css" />
    <title>Login - Skye-Trade</title>
    <!-- Smartsupp Live Chat script -->
  </head>
  <body>
    <section class="overlay">
      <div class="login-container">
        <div class="langBox">
          <!-- Hidden Google Translate container -->
          <div id="google_translate_element" style="display: none"></div>
          <div id="google_translate_element2" style="display: none"></div>

          <!-- Translate button with dropdown -->
          <div class="translate-dropdown">
            <button class="translate-btn">
              <img class="defaultFlag" src="https://flagcdn.com/w40/gb.png" />
            </button>
            <div id="language-menu" class="dropdown-content">
              <div data-code="en|en" data-flag="gb" class="language-menu-item">
                <img src="https://flagcdn.com/w40/gb.png" alt="English" />
                English
              </div>
              <div data-code="en|fr" data-flag="fr" class="language-menu-item">
                <img src="https://flagcdn.com/w40/fr.png" alt="French" /> French
              </div>
              <div data-code="en|es" data-flag="es" class="language-menu-item">
                <img src="https://flagcdn.com/w40/es.png" alt="Spanish" />
                Spanish
              </div>
              <div data-code="en|de" data-flag="de" class="language-menu-item">
                <img src="https://flagcdn.com/w40/de.png" alt="German" /> German
              </div>
              <div
                data-code="en|zh-CN"
                data-flag="cn"
                class="language-menu-item"
              >
                <img src="https://flagcdn.com/w40/cn.png" alt="Chinese" />
                Chinese
              </div>
            </div>
          </div>
        </div>
        <div class="logo-container">
          <img src="../assets/logo-white.png" alt="Logo" class="logo" />
        </div>

        <h2>Sign In</h2>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginIdentifier">Email or Username</label>
            <input type="text" id="loginIdentifier" name="loginIdentifier" />
            <div class="error-message" id="loginIdentifierError"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
            <div class="error-message" id="passwordError"></div>
          </div>
          <button id="submitBtn" type="submit" class="btn btn-primary">
            Log In
          </button>
        </form>

        <div class="signup-link">
          Forgot your password?
          <a href="/forgetPassword/index.html">Click here</a>
        </div>
      </div>
    </section>
    <script type="module" src="../scripts/login.js"></script>
    <script src="../scripts/googleTranslate.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/smartsuppLivechat.js"></script>
    <script
      type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit2"
    ></script>
  </body>
</html>
