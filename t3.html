<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Hide Google Translate top bar */
      iframe {
        visibility: hidden !important;
      }
      body .goog-te-banner-frame.skiptranslate {
        display: none !important;
      }

      body {
        top: 0px !important;
      }

      /* Hide tooltip on hover */
      .goog-tooltip {
        display: none !important;
      }
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }

      /* Hide the translate tooltip on hover */
      .goog-te-balloon-frame {
        display: none !important;
      }

      iframe.goog-te-banner-frame {
        display: none !important;
      }

      iframe#goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-menu-frame {
        display: none !important;
      }

      body {
        position: static !important;
        top: 0px !important;
      }
    </style>
  </head>
  <body>
    <select id="language_selector" style="font-size: 16px; padding: 5px">
      <option value="">🌐 Select Language</option>
      <option value="de">🇩🇪 German</option>
      <option value="fr">🇫🇷 French</option>
      <option value="es">🇪🇸 Spanish</option>
      <option value="zh-CN">🇨🇳 Chinese (Simplified)</option>
      <option value="ar">🇸🇦 Arabic</option>
    </select>

    <h1>Welcome to the Language Selector Page</h1>
    <p>
      This page allows you to select a language for translation using Google
      Translate. Choose a language from the dropdown above to see the content in
      that language.
    </p>

    <div id="google_translate_element" style="display: none"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>

    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <script>
      function doGTranslate(lang) {
        if (!lang) return; // no language selected, do nothing

        var combo = document.querySelector(".goog-te-combo");
        if (!combo) {
          // Retry after 500ms if widget not ready
          setTimeout(function () {
            doGTranslate(lang);
          }, 500);
        } else {
          combo.value = lang;
          // Fire the change event on the select element
          combo.dispatchEvent(new Event("change"));
        }
      }

      // Listen for language selection change
      document
        .getElementById("language_selector")
        .addEventListener("change", function () {
          var lang = this.value;
          doGTranslate(lang);
        });

      setTimeout(() => {
        document
          .querySelectorAll("iframe.goog-te-banner-frame")
          .forEach((el) => (el.style.display = "none"));
        document.body.style.top = "0px";
      }, 1000);
    </script>
  </body>
</html>
