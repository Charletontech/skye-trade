<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Sign Up - SkyeTrade</title>
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../css/swal-toast.css" />
    <noscript> Powered by <a href=“https://www.smartsupp.com” target=“_blank”>Smartsupp</a></noscript>
  </head>

  <body>
    <div class="container">
      <!-- <div class="langBox-down "> -->
          <div id="google_translate_element" style="display: none"></div>
          <div id="google_translate_element2" style="display: none"></div>

         
        <!-- </div> -->
      <div class="form-wrapper">
         <!-- translate button -->
           <div class="translate-dropdown dropdown-content-up">
            <button class="translate-btn" style="position: fixed; top: 40px;">
              <img class="defaultFlag" src="https://flagcdn.com/w40/gb.png" />
            </button>
            <div id="language-menu" class="dropdown-content" style="margin-top: 20px; position: fixed; top: 40px;" >
              <div data-code="en|en" data-flag="gb" class="language-menu-item">
                <img src="https://flagcdn.com/w40/gb.png" alt="English" />
                English
              </div>
              <div data-code="en|fr" data-flag="fr" class="language-menu-item">
                <img src="https://flagcdn.com/w40/fr.png" alt="French" /> French
              </div>
              <div data-code="en|es" data-flag="es" class="language-menu-item">
                <img src="https://flagcdn.com/w40/es.png" alt="Spanish" />
                Spanish
              </div>
              <div data-code="en|de" data-flag="de" class="language-menu-item">
                <img src="https://flagcdn.com/w40/de.png" alt="German" /> German
              </div>
              <div
                data-code="en|zh-CN"
                data-flag="cn"
                class="language-menu-item"
              >
                <img src="https://flagcdn.com/w40/cn.png" alt="Chinese" />
                Chinese
              </div>
            </div>
          </div>
          <!-- translate button ends -->
        <div class="logo">
          <img src="../assets/logo-white.png" alt="logo" />
        </div>
        <h2>Register</h2>
        <form id="signupForm">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input name="fullName" type="text" required />
            </div>
            <div class="form-group">
              <label>Username</label>
              <input name="username" type="text" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email Address</label>
              <input name="email" type="email" required />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input name="phone" type="tel" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Gender</label>
              <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Account Type</label>
              <select name="accountType" required>
                <option value="">Select Account Type</option>
                <option value="Standard Account">Standard Account</option>
                <option value="ECN Account">ECN Account</option>
                <option value="Pro Account">Pro Account</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Country</label>
            <select name="country" required></select>
          </div>
          <div class="form-group">
            <label>Currency</label>
            <select name="currency" required>
              <option value="">Select Currency</option>
              <option value="$">USD ($)</option>
              <option value="(€)">EUR (€)</option>
              <option value="(£)">GBP (£)</option>
              <option value="(¥)">JPY (¥)</option>
              <option value="(A$)">AUD (A$)</option>
              <option value="(C$)">CAD (C$)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input name="zipCode" type="text" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Password</label>
              <input name="password" type="password" required />
            </div>
            <div class="form-group">
              <label>Repeat Password</label>
              <input name="repeatPassword" type="password" required />
            </div>
          </div>
          <div class="checkbox">
            <input name="t&c" type="checkbox" required />
            <label>I have read and agreed to Terms & Conditions</label>
          </div>
          <div id="successMessage" class="success-message">
            🎉 Registration Successful!
          </div>
          <button type="submit" class="btn-submit">Sign Up</button>
        </form>
      </div>
    </div>

    <script type="module" src="../scripts/signup.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/smartsuppLivechat.js"></script>
     <script
      type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit2"
    ></script>
    <script src="../scripts/googleTranslate.js"></script>
  </body>
</html>
